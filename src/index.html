<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>omelet-表达训练系统</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-block">
        <span class="brand-mark">om</span>
        <div>
          <div class="app-title">omelet-表达训练系统</div>
          <div class="app-subtitle">实时表达训练工作台</div>
        </div>
      </div>
      <div class="topbar-right">
        <span id="timer" class="timer">00:00</span>
        <button id="btn-prompt-editor" class="btn-icon" title="训练规则" aria-label="训练规则">规则</button>
        <button id="btn-settings" class="btn-icon" title="设置" aria-label="设置">设置</button>
      </div>
    </header>

    <div class="layout">
      <aside class="panel-left panel-shell">
        <div class="panel-heading">
          <span class="section-kicker">训练指标</span>
          <h2>表达分析</h2>
        </div>
        <div class="stats-grid">
          <div class="stat-row">
            <span class="stat-label">笼统词</span>
            <span id="stat-vague" class="stat-value stat-red">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">填充词</span>
            <span id="stat-fillers" class="stat-value stat-orange">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">犹豫词</span>
            <span id="stat-hedges" class="stat-value stat-yellow">0</span>
          </div>
          <div class="stat-row stat-row-primary">
            <span class="stat-label">表达密度</span>
            <span id="stat-density" class="stat-value stat-green">--</span>
          </div>
        </div>
      </aside>

      <main class="main-area">
        <div class="workspace-panel panel-shell">
          <div class="subtitle-topbar">
            <button id="btn-paste" class="btn-sm btn-paste-top">粘贴逐字稿</button>
            <div class="subtitle-topbar-right">
              <button id="btn-copy-text" class="btn-sm hidden" title="复制原文">
                <span class="btn-label">复制原文</span>
              </button>
              <button id="btn-save-text" class="btn-sm hidden" title="保存原文">
                <span class="btn-label">保存原文</span>
              </button>
              <button id="btn-clear" class="btn-sm hidden" title="清空">清空</button>
            </div>
          </div>

          <div id="model-status" class="model-status model-status-checking">
            <div class="model-status-copy">
              <span class="model-status-dot"></span>
              <span id="model-status-text">正在检测本地语音模型...</span>
            </div>
            <div id="model-status-actions" class="model-status-actions hidden">
              <button id="btn-open-models-dir" class="btn-sm">打开模型目录</button>
              <a id="model-download-link" class="model-download-link" target="_blank" rel="noreferrer">下载模型</a>
              <button id="btn-refresh-model-status" class="btn-sm">重新检测</button>
            </div>
          </div>

          <div id="subtitle-scroll" class="subtitle-scroll">
            <div id="subtitle-container" class="subtitle-container">
              <div class="subtitle-line hint">点击下方按钮开始说话</div>
            </div>
          </div>
        </div>

        <div class="action-bar panel-shell">
          <button id="btn-start" class="btn-main btn-start">
            <span class="btn-label">开始录制</span>
          </button>
          <button id="btn-pause" class="btn-main btn-pause hidden">
            <span class="btn-label">暂停</span>
          </button>
          <button id="btn-resume" class="btn-main btn-resume hidden">
            <span class="btn-label">继续</span>
          </button>
          <button id="btn-stop" class="btn-main btn-stop hidden">
            <span class="btn-label">结束</span>
          </button>
          <button id="btn-report" class="btn-main btn-report hidden">
            <span class="btn-label">生成报告</span>
          </button>
        </div>
      </main>

      <aside class="panel-right panel-shell">
        <div class="panel-heading">
          <span class="section-kicker">实时建议</span>
          <h2>反馈队列</h2>
        </div>
        <div id="feedback-content" class="feedback-content">
          <div class="feedback-empty">开始录制或粘贴逐字稿后，这里会显示实时反馈。</div>
        </div>
      </aside>
    </div>
  </div>

  <div id="paste-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>粘贴逐字稿</h2>
        <button id="btn-close-paste" class="btn-close" aria-label="关闭">×</button>
      </div>
      <div class="modal-body paste-body">
        <p class="modal-note">把逐字稿粘贴进来，系统会按句分析词库命中并生成反馈。</p>
        <textarea id="paste-textarea" placeholder="在这里粘贴文本..."></textarea>
        <button id="btn-analyze-paste" class="btn-main btn-start modal-action">开始分析</button>
      </div>
    </div>
  </div>

  <div id="report-modal" class="modal hidden">
    <div class="modal-content report-content">
      <div class="modal-header">
        <h2>表达分析报告</h2>
        <div class="modal-header-actions">
          <button id="btn-copy-report" class="btn-sm">复制全文</button>
          <button id="btn-close-report" class="btn-close" aria-label="关闭">×</button>
        </div>
      </div>
      <div id="report-body" class="modal-body"></div>
    </div>
  </div>

  <script src="app-utils.js"></script>
  <script src="transcript-view.js"></script>
  <script src="feedback-view.js"></script>
  <script src="app.js"></script>
</body>
</html>
